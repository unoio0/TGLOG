services:
  logger:
    build: .
    container_name: tg-deleted-logger
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./logger.py:/app/logger.py
      - ./keyword_alerter.py:/app/keyword_alerter.py